id: k5a.tail-reopen-keeps-start
title: "A reopen repeats the first request's start and types and adds Last-Event-ID, never a cursor query"
behaviours: [K5a]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - tail: { types: ["lesson_plan.ready","lesson_plan.failed"], start: oldest, take: 2 }
    expect:
      outcome: completed
      event_ids: ["lgr_evt_conformance1","lgr_evt_conformance2"]
      sleeps_s: [1]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_tail, token_type: Bearer, expires_in: 3600, scope: "events:read" } }
    - request: { method: GET, path: /v1/events/stream, query: {"start":"oldest","types":"lesson_plan.ready,lesson_plan.failed"}, headers: { authorization: { equals: Bearer lgr_at_tail }, accept: { contains: text/event-stream }, last-event-id: { absent: true } } }
      response:
        status: 200
        sse:
          chunks:
            - "id: c1\nevent: event\ndata: {\"id\":\"lgr_evt_conformance1\",\"type\":\"lesson_plan.ready\",\"created_at\":\"2026-10-01T09:12:44Z\",\"api_version\":\"2026-09-equipped-boxfish\",\"subject\":\"lgr_sub_conformance\",\"data\":{\"plan_id\":\"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37\",\"status\":\"complete\",\"title\":\"At the night market\",\"source_lang\":\"en\",\"target_lang\":\"zh\",\"level\":2}}\n\n"
          then: close
    - request: { method: GET, path: /v1/events/stream, query: {"start":"oldest","types":"lesson_plan.ready,lesson_plan.failed"}, headers: { authorization: { equals: Bearer lgr_at_tail }, accept: { contains: text/event-stream }, last-event-id: { equals: c1 } } }
      response:
        status: 200
        sse:
          chunks:
            - "id: c2\nevent: event\ndata: {\"id\":\"lgr_evt_conformance2\",\"type\":\"lesson_plan.failed\",\"created_at\":\"2026-10-01T09:13:02Z\",\"api_version\":\"2026-09-equipped-boxfish\",\"subject\":\"lgr_sub_conformance\",\"data\":{\"plan_id\":\"0f1e2d3c-4b5a-4978-8796-a5b4c3d2e1f0\",\"reason\":\"generation_failed\"}}\n\n"
          then: hold
          disconnect_within_ms: 2000
