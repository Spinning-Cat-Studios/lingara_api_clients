id: k5a.tail-200-then-error-still-bounded
title: "A 200 that brings only an error event does not reset the failure count, so the eighth such connection is raised"
behaviours: [K5a, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - tail: { take: 1 }
    expect:
      outcome: error
      event_ids: []
      error: { variant: ApiError, fields: { status: 200, code: stream_interrupted, message: The stream was interrupted. } }
      sleeps_s: [1, 2, 4, 8, 16, 30, 30]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_tail, token_type: Bearer, expires_in: 3600, scope: "events:read" } }
    - times: 8
      request: { method: GET, path: /v1/events/stream, headers: { authorization: { equals: Bearer lgr_at_tail }, accept: { contains: text/event-stream }, last-event-id: { absent: true } } }
      response:
        status: 200
        sse:
          chunks:
            - "event: error\ndata: {\"code\":\"stream_interrupted\",\"message\":\"The stream was interrupted.\"}\n\n"
          then: close
