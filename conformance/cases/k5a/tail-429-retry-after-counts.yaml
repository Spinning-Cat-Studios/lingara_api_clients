id: k5a.tail-429-retry-after-counts
title: "A tail open bypasses K4: each 429 is one tail failure, a Retry-After replaces that step's delay, and the doubling goes on from the step count"
behaviours: [K5a, K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - tail: { take: 1 }
    expect:
      outcome: completed
      event_ids: ["lgr_evt_conformance1"]
      sleeps_s: [5, 2]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_tail, token_type: Bearer, expires_in: 3600, scope: "events:read" } }
    - request: { method: GET, path: /v1/events/stream, headers: { authorization: { equals: Bearer lgr_at_tail }, accept: { contains: text/event-stream }, last-event-id: { absent: true } } }
      response: { status: 429, headers: { retry-after: "5" }, json: { code: rate_limited, error: Too many streams. } }
    - request: { method: GET, path: /v1/events/stream, headers: { authorization: { equals: Bearer lgr_at_tail }, accept: { contains: text/event-stream }, last-event-id: { absent: true } } }
      response: { status: 429, json: { code: rate_limited, error: Too many streams. } }
    - request: { method: GET, path: /v1/events/stream, headers: { authorization: { equals: Bearer lgr_at_tail }, accept: { contains: text/event-stream }, last-event-id: { absent: true } } }
      response:
        status: 200
        sse:
          chunks:
            - "id: c1\nevent: event\ndata: {\"id\":\"lgr_evt_conformance1\",\"type\":\"lesson_plan.ready\",\"created_at\":\"2026-10-01T09:12:44Z\",\"api_version\":\"2026-09-equipped-boxfish\",\"subject\":\"lgr_sub_conformance\",\"data\":{\"plan_id\":\"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37\",\"status\":\"complete\",\"title\":\"At the night market\",\"source_lang\":\"en\",\"target_lang\":\"zh\",\"level\":2}}\n\n"
          then: hold
          disconnect_within_ms: 2000
