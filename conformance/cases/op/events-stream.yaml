id: op.events-stream
title: "The raw event stream is one connection under K5: it yields each event frame and ends on done without yielding it"
behaviours: [K1, K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: streamEvents }
    expect:
      outcome: completed
      served_version: 2026-09-equipped-boxfish
      events:
        - { event: event, data: {"id":"lgr_evt_conformance1","type":"lesson_plan.ready","created_at":"2026-10-01T09:12:44Z","api_version":"2026-09-equipped-boxfish","subject":"lgr_sub_conformance","data":{"plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","status":"complete","title":"At the night market","source_lang":"en","target_lang":"zh","level":2}} }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opstream, token_type: Bearer, expires_in: 3600, scope: "events:read" } }
    - request: { method: GET, path: /v1/events/stream, headers: { authorization: { equals: Bearer lgr_at_opstream }, accept: { contains: text/event-stream }, last-event-id: { absent: true } } }
      response:
        status: 200
        headers: { lingara-version: 2026-09-equipped-boxfish }
        sse:
          chunks:
            - "id: c1\nevent: event\ndata: {\"id\":\"lgr_evt_conformance1\",\"type\":\"lesson_plan.ready\",\"created_at\":\"2026-10-01T09:12:44Z\",\"api_version\":\"2026-09-equipped-boxfish\",\"subject\":\"lgr_sub_conformance\",\"data\":{\"plan_id\":\"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37\",\"status\":\"complete\",\"title\":\"At the night market\",\"source_lang\":\"en\",\"target_lang\":\"zh\",\"level\":2}}\n\n"
            - ": keepalive\n\n"
            - "id: h1\nevent: done\ndata: {}\n\n"
          then: close
