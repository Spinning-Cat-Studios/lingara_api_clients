id: op.embed-player-unlink
title: Unlinking a player sends a DELETE to its link with no content-type and completes on an empty 204 with the served version
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: unlinkEmbedPlayer
      params: { player_ref: p-1001 }
    expect:
      outcome: completed
      status: 204
      served_version: 2026-10-virile-dragon
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opunlink, token_type: Bearer, expires_in: 3600, scope: "embed:mint" } }
    - request:
        method: DELETE
        path: /v1/embed/players/p-1001/link
        headers: { authorization: { equals: Bearer lgr_at_opunlink }, content-type: { absent: true } }
      response:
        status: 204
        headers: { lingara-version: 2026-10-virile-dragon }
