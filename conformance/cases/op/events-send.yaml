id: op.events-send
title: "Sending an event posts {type, data} with a generated UUIDv4 Idempotency-Key, or the caller's key unchanged, and returns the 202"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: sendEvent
      body: {"type":"world.context_changed","data":{"scene":"A night market after rain","source_lang":"en","target_lang":"zh","level":2,"generate":true}}
    expect: { outcome: completed, status: 202, body: {"id":"lgr_evt_conformance9","type":"world.context_changed","created_at":"2026-10-01T09:12:44Z","reaction":{"status":"started","plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","plan_status":"generating"}} }
  - call:
      operation: sendEvent
      body: {"type":"world.practice_requested","data":{"topic":"Asking for directions","source_lang":"en","target_lang":"zh","level":2,"generate":false}}
      idempotency_key: game-save-17/practice
    expect: { outcome: completed, status: 202, body: {"id":"lgr_evt_conformance8","type":"world.practice_requested","created_at":"2026-10-01T09:12:50Z"} }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opsend, token_type: Bearer, expires_in: 3600, scope: "events:write lesson_plans:write" } }
    - request:
        method: POST
        path: /v1/events
        headers: { authorization: { equals: Bearer lgr_at_opsend }, idempotency-key: { pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }, content-type: { prefix: application/json } }
        json: {"type":"world.context_changed","data":{"scene":"A night market after rain","source_lang":"en","target_lang":"zh","level":2,"generate":true}}
      response: { status: 202, json: {"id":"lgr_evt_conformance9","type":"world.context_changed","created_at":"2026-10-01T09:12:44Z","reaction":{"status":"started","plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","plan_status":"generating"}} }
    - request:
        method: POST
        path: /v1/events
        headers: { idempotency-key: { equals: game-save-17/practice } }
        json: {"type":"world.practice_requested","data":{"topic":"Asking for directions","source_lang":"en","target_lang":"zh","level":2,"generate":false}}
      response: { status: 202, json: {"id":"lgr_evt_conformance8","type":"world.practice_requested","created_at":"2026-10-01T09:12:50Z"} }
