id: op.vocab-stream
title: A vocabulary stream yields started and each item, and ends on done without yielding it
behaviours: [K1, K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: generateVocabulary
      body: { level: 2, source_lang: en, target_lang: zh, count: 2 }
    expect:
      outcome: completed
      served_version: 2026-09-knowing-tenpounder
      events:
        - { event: started, data: { meta: { level: 2, source_lang: en, target_lang: zh, framework: HSK, count: 2, ai_generated: true } } }
        - { event: item, data: { word: 你好, pronunciation: nǐ hǎo, translation: hello, example: { sentence: 你好，我叫小明。, translation: "Hello, my name is Xiaoming." } } }
        - { event: item, data: { word: 谢谢, pronunciation: xiè xie, translation: thank you } }
exchanges:
  items:
    - request:
        method: POST
        path: /oauth/token
        headers: { accept: { contains: application/json } }
        form: { grant_type: client_credentials }
      response: { status: 200, json: { access_token: lgr_at_opvocab, token_type: Bearer, expires_in: 3600, scope: "vocab:generate" } }
    - request:
        method: POST
        path: /v1/vocab/stream
        headers:
          authorization: { equals: Bearer lgr_at_opvocab }
          accept: { contains: text/event-stream }
          content-type: { prefix: application/json }
        json: { level: 2, source_lang: en, target_lang: zh, count: 2 }
      response:
        status: 200
        headers: { lingara-version: 2026-09-knowing-tenpounder }
        sse:
          chunks:
            - "event: started\ndata: {\"meta\":{\"level\":2,\"source_lang\":\"en\",\"target_lang\":\"zh\",\"framework\":\"HSK\",\"count\":2,\"ai_generated\":true}}\n\n"
            - "event: item\ndata: {\"word\":\"你好\",\"pronunciation\":\"nǐ hǎo\",\"translation\":\"hello\",\"example\":{\"sentence\":\"你好，我叫小明。\",\"translation\":\"Hello, my name is Xiaoming.\"}}\n\n"
            - ": keepalive\n\n"
            - "event: item\ndata: {\"word\":\"谢谢\",\"pronunciation\":\"xiè xie\",\"translation\":\"thank you\"}\n\n"
            - "event: done\ndata: {}\n\n"
          then: close
