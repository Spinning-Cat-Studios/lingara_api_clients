id: op.embed-player-link
title: Linking a player sends a PUT with the bearer, no content-type and no JSON body, and returns all seven EmbedPlayerLink fields with the served version
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: linkEmbedPlayer
      params: { player_ref: p-1001 }
    expect:
      outcome: completed
      status: 200
      served_version: 2026-10-virile-dragon
      body: { status: linked, subject: lgr_sub_conformance9c41d07be2a35f68, previous_subject: lgr_sub_conformance2be0f15a8c7d3e96, linked_at: "2026-11-02T18:04:11Z", scopes: ["embed:play", "events:read"], carried: { lesson_plans: 2 }, kept: { lesson_plans: 1 } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_oplink, token_type: Bearer, expires_in: 3600, scope: "embed:play" } }
    - request:
        method: PUT
        path: /v1/embed/players/p-1001/link
        headers: { authorization: { equals: Bearer lgr_at_oplink }, content-type: { absent: true }, accept: { contains: application/json } }
      response:
        status: 200
        headers: { lingara-version: 2026-10-virile-dragon }
        json: { status: linked, subject: lgr_sub_conformance9c41d07be2a35f68, previous_subject: lgr_sub_conformance2be0f15a8c7d3e96, linked_at: "2026-11-02T18:04:11Z", scopes: ["embed:play", "events:read"], carried: { lesson_plans: 2 }, kept: { lesson_plans: 1 } }
