id: op.no-credentials-client
title: A client built without credentials calls the three operations that need no token
behaviours: [K1]
steps:
  - call: { operation: getOpenApiDocument }
    expect: { outcome: completed, status: 200, body: { openapi: 3.2.0, info: { title: Lingara API, version: 2026-09-knowing-tenpounder }, paths: {} } }
  - call: { operation: listApiVersions }
    expect: { outcome: completed, status: 200, body: { current: 2026-09-knowing-tenpounder, development: 2026-09-glowing-hoatzin, versions: [] } }
  - call:
      operation: getApiVersion
      params: { id: 2026-09-knowing-tenpounder }
    expect:
      outcome: completed
      status: 200
      body: { id: 2026-09-knowing-tenpounder, state: supported, lts: false, minted_at: "2026-09-20T09:00:00Z", summary: The first surface., history: [], spec: { url: /v1/openapi.json, sha256: 3b7e0c1f9a2d4e5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3 } }
exchanges:
  items:
    - request: { method: GET, path: /v1/openapi.json, headers: { authorization: { absent: true } } }
      response: { status: 200, json: { openapi: 3.2.0, info: { title: Lingara API, version: 2026-09-knowing-tenpounder }, paths: {} } }
    - request: { method: GET, path: /v1/versions, headers: { authorization: { absent: true } } }
      response: { status: 200, json: { current: 2026-09-knowing-tenpounder, development: 2026-09-glowing-hoatzin, versions: [] } }
    - request: { method: GET, path: /v1/versions/2026-09-knowing-tenpounder, headers: { authorization: { absent: true } } }
      response: { status: 200, json: { id: 2026-09-knowing-tenpounder, state: supported, lts: false, minted_at: "2026-09-20T09:00:00Z", sunset_at: null, summary: The first surface., history: [], spec: { url: /v1/openapi.json, sha256: 3b7e0c1f9a2d4e5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3 } } }
