id: op.dialogues-page-all
title: "pageDialogues follows two cursors, resends name and limit on every page, yields every item once and stops on has_more false"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - page_dialogues:
      params: {"name":"market","limit":1}
    expect:
      outcome: completed
      body: [{"id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71","name":"Night market","ir_id":"night_market_keepers","created_at":"2026-10-28T09:00:00Z","updated_at":"2026-10-28T10:30:00Z","has_draft":true,"active_revision":2,"npc_count":1,"checkpoint_count":3},{"id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a72","name":"Market gate","ir_id":"market_gate","created_at":"2026-10-28T09:00:00Z","updated_at":"2026-10-28T10:30:00Z","has_draft":false,"active_revision":1,"npc_count":2,"checkpoint_count":1},{"id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a73","name":"Market tea stall","ir_id":"tea_stall","created_at":"2026-10-28T09:00:00Z","updated_at":"2026-10-28T10:30:00Z","has_draft":true,"active_revision":null,"npc_count":1,"checkpoint_count":2}]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_dlpage, token_type: Bearer, expires_in: 3600, scope: "dialogues:read" } }
    - request:
        method: GET
        path: /v1/dialogues
        query: {"name":"market","limit":"1"}
        headers: { authorization: { equals: Bearer lgr_at_dlpage }, accept: { contains: application/json } }
      response: { status: 200, headers: { lingara-version: 2026-10-simple-tarpon }, json: {"items":[{"id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71","name":"Night market","ir_id":"night_market_keepers","created_at":"2026-10-28T09:00:00Z","updated_at":"2026-10-28T10:30:00Z","has_draft":true,"active_revision":2,"npc_count":1,"checkpoint_count":3}],"next_cursor":"dl1","has_more":true} }
    - request:
        method: GET
        path: /v1/dialogues
        query: {"name":"market","limit":"1","cursor":"dl1"}
        headers: { authorization: { equals: Bearer lgr_at_dlpage }, accept: { contains: application/json } }
      response: { status: 200, headers: { lingara-version: 2026-10-simple-tarpon }, json: {"items":[{"id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a72","name":"Market gate","ir_id":"market_gate","created_at":"2026-10-28T09:00:00Z","updated_at":"2026-10-28T10:30:00Z","has_draft":false,"active_revision":1,"npc_count":2,"checkpoint_count":1}],"next_cursor":"dl2","has_more":true} }
    - request:
        method: GET
        path: /v1/dialogues
        query: {"name":"market","limit":"1","cursor":"dl2"}
        headers: { authorization: { equals: Bearer lgr_at_dlpage }, accept: { contains: application/json } }
      response: { status: 200, headers: { lingara-version: 2026-10-simple-tarpon }, json: {"items":[{"id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a73","name":"Market tea stall","ir_id":"tea_stall","created_at":"2026-10-28T09:00:00Z","updated_at":"2026-10-28T10:30:00Z","has_draft":true,"active_revision":null,"npc_count":1,"checkpoint_count":2}],"next_cursor":null,"has_more":false} }
