exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_dlsave, token_type: Bearer, expires_in: 3600, scope: "dialogues:write" } }
    - request:
        method: PUT
        path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/draft
        headers: { authorization: { equals: Bearer lgr_at_dlsave }, accept: { contains: application/json }, content-type: { contains: application/json } }
        json: {"definition":{"schema":"dialogue.v1","id":"night_market_keepers","start":"greet","npcs":[{"id":"old_wei","name":"Old Wei"}],"checkpoints":[{"id":"greet","goal":"Greet the stranger","may_disclose":[],"edges":[{"id":"thanked","to":"success","when":"the player says thank you"}]}],"facts":[],"pedagogy":"subtle"},"draft_version":4}
