id: op.dialogues-save-draft
title: "Saving a dialogue draft sends a PUT to the draft path with the definition and draft_version and decodes the Dialogue"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: saveDialogueDraft
      params: {"dialogue_id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71"}
      body: {"definition":{"schema":"dialogue.v1","id":"night_market_keepers","start":"greet","npcs":[{"id":"old_wei","name":"Old Wei"}],"checkpoints":[{"id":"greet","goal":"Greet the stranger","may_disclose":[],"edges":[{"id":"thanked","to":"success","when":"the player says thank you"}]}],"facts":[],"pedagogy":"subtle"},"draft_version":4}
    expect:
      outcome: completed
      status: 200
