id: op.embed-token-create-update-malformed
title: A mint answering a malformed update_available still returns the six fields, with no notice
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: createEmbedToken
      body: { player_ref: player-1004, embed_version: "1.1.0" }
    expect:
      outcome: completed
      status: 200
      body: { token: lgr_et_conformance55555555555555555555555555555555, expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: lgr_sub_conformance4b5a697887960514, scopes: ["embed:play"], account_linked: false, update_available: null }
  - call:
      operation: createEmbedToken
      body: { player_ref: player-1005, embed_version: "1.1.0" }
    expect:
      outcome: completed
      status: 200
      body: { token: lgr_et_conformance66666666666666666666666666666666, expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: lgr_sub_conformance5a69788796051423, scopes: ["embed:play"], account_linked: false, update_available: null }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opmintmalformed, token_type: Bearer, expires_in: 3600, scope: "embed:mint" } }
    - request: { method: POST, path: /v1/embed/tokens, json: { player_ref: player-1004, embed_version: "1.1.0" } }
      response:
        status: 200
        json: { token: lgr_et_conformance55555555555555555555555555555555, expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: lgr_sub_conformance4b5a697887960514, scopes: ["embed:play"], account_linked: false, update_available: { latest: 7 } }
    - request: { method: POST, path: /v1/embed/tokens, json: { player_ref: player-1005, embed_version: "1.1.0" } }
      response:
        status: 200
        json: { token: lgr_et_conformance66666666666666666666666666666666, expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: lgr_sub_conformance5a69788796051423, scopes: ["embed:play"], account_linked: false, update_available: 5 }
