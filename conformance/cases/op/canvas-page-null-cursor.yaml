id: op.canvas-page-null-cursor
title: "A page with has_more true and a null next_cursor ends pageCanvases with TransportError malformed_response after one request"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - page_canvases: {}
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_cvnull, token_type: Bearer, expires_in: 3600, scope: "canvas:read" } }
    - request:
        method: GET
        path: /v1/canvases
        headers: { authorization: { equals: Bearer lgr_at_cvnull }, accept: { contains: application/json } }
      response: { status: 200, headers: { lingara-version: 2026-10-simple-tarpon }, json: {"items":[{"id":"6b1f0c3e-2a4d-4e8f-9b7a-1c2d3e4f5a61","name":"Lesson plan webhook","recipe":"lesson_plan_ready","created_at":"2026-10-20T09:00:00Z","updated_at":"2026-10-21T10:30:00Z","has_draft":true,"active_revision":2,"node_count":2,"node_kinds":["client","webhook"],"scopes":["events:read"],"objects":[{"handle":"n1","kind":"client","id":"0b9e4c2d-7a1f-4e3b-9d8c-5f6a7b8c9d0e"}]}],"total":null,"next_cursor":null,"has_more":true} }
