id: op.usage-get
title: Getting usage returns the allowance rows
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: completed
      status: 200
      body:
        allowance:
          - { feature: vocab, window: daily, limit: 50, used: 12, remaining: 38, reset_at: 1790208000 }
          - { feature: lesson_plans, window: lifetime, limit: 3, used: 1, remaining: 2 }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opusage, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_opusage } } }
      response:
        status: 200
        json:
          allowance:
            - { feature: vocab, window: daily, limit: 50, used: 12, remaining: 38, reset_at: 1790208000 }
            - { feature: lesson_plans, window: lifetime, limit: 3, used: 1, remaining: 2, reset_at: null }
