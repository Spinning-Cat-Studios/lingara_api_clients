id: op.dialogue-plan-refused
title: A 403 embed_needs_metered on a plan raises ApiError with that status and code after one request (ADR 3.11.26n AC25)
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: planDialogue
      body: { document: { schema: dialogue.v2, kind: procedural, id: the_ferryman }, npc: ma_ren, reason: start, id_prefix: p1, turns: 0, beats: 0 }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 403, code: embed_needs_metered, message: Embedding needs a metered client., retry_after: null } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opplanrefused, token_type: Bearer, expires_in: 3600, scope: "embed:play" } }
    - request:
        method: POST
        path: /v1/embed/dialogue/plan
        headers: { authorization: { equals: Bearer lgr_at_opplanrefused } }
        json: { document: { schema: dialogue.v2, kind: procedural, id: the_ferryman }, npc: ma_ren, reason: start, id_prefix: p1, turns: 0, beats: 0 }
      response: { status: 403, json: { code: embed_needs_metered, error: Embedding needs a metered client. } }
