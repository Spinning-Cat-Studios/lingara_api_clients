id: op.events-list
title: "Listing events returns one page as JSON, with the query it was given"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: listEvents
      params: { limit: 2, types: [lesson_plan.ready, lesson_plan.failed] }
    expect:
      outcome: completed
      status: 200
      body: {"items":[{"id":"lgr_evt_conformance1","type":"lesson_plan.ready","created_at":"2026-10-01T09:12:44Z","api_version":"2026-09-equipped-boxfish","subject":"lgr_sub_conformance","data":{"plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","status":"complete","title":"At the night market","source_lang":"en","target_lang":"zh","level":2}}],"next_cursor":"c1","has_more":true}
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_oplist, token_type: Bearer, expires_in: 3600, scope: "events:read" } }
    - request:
        method: GET
        path: /v1/events
        query: { limit: "2", types: "lesson_plan.ready,lesson_plan.failed" }
        headers: { authorization: { equals: Bearer lgr_at_oplist }, accept: { contains: application/json } }
      response: { status: 200, json: {"items":[{"id":"lgr_evt_conformance1","type":"lesson_plan.ready","created_at":"2026-10-01T09:12:44Z","api_version":"2026-09-equipped-boxfish","subject":"lgr_sub_conformance","data":{"plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","status":"complete","title":"At the night market","source_lang":"en","target_lang":"zh","level":2}}],"next_cursor":"c1","has_more":true} }
