id: op.embed-player-link-encodes-ref
title: A link's player_ref is sent as one path segment before /link, every byte outside the unreserved set as upper-case %XX
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: linkEmbedPlayer
      params: { player_ref: "guild/42 (é)*" }
    expect:
      outcome: completed
      status: 200
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_oplinkref, token_type: Bearer, expires_in: 3600, scope: "embed:play" } }
    - request:
        method: PUT
        path: /v1/embed/players/guild%2F42%20%28%C3%A9%29%2A/link
        headers: { authorization: { equals: Bearer lgr_at_oplinkref } }
      response:
        status: 200
        json: { status: linked, subject: lgr_sub_conformance9c41d07be2a35f68, previous_subject: lgr_sub_conformance2be0f15a8c7d3e96, linked_at: "2026-11-02T18:04:11Z", scopes: ["embed:play"], carried: {}, kept: {} }
