id: op.dialogues-save-draft-conflict
title: "A stale draft_version's 409 dialogue_conflict is raised as ApiError with that code after one request, never retried"
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: saveDialogueDraft
      params: {"dialogue_id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71"}
      body: {"definition":{"schema":"dialogue.v1","id":"night_market_keepers","start":"greet","npcs":[{"id":"old_wei","name":"Old Wei"}],"checkpoints":[{"id":"greet","goal":"Greet the stranger","may_disclose":[],"edges":[{"id":"thanked","to":"success","when":"the player says thank you"}]}],"facts":[],"pedagogy":"subtle"},"draft_version":4}
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 409, code: dialogue_conflict, message: This dialogue changed since you opened it. } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_dlconflict, token_type: Bearer, expires_in: 3600, scope: "dialogues:write" } }
    - request:
        method: PUT
        path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/draft
        headers: { authorization: { equals: Bearer lgr_at_dlconflict }, accept: { contains: application/json }, content-type: { contains: application/json } }
        json: {"definition":{"schema":"dialogue.v1","id":"night_market_keepers","start":"greet","npcs":[{"id":"old_wei","name":"Old Wei"}],"checkpoints":[{"id":"greet","goal":"Greet the stranger","may_disclose":[],"edges":[{"id":"thanked","to":"success","when":"the player says thank you"}]}],"facts":[],"pedagogy":"subtle"},"draft_version":4}
      response: { status: 409, json: { code: dialogue_conflict, error: This dialogue changed since you opened it. } }
