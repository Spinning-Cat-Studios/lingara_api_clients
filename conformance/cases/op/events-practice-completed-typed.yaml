behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - events: { types: [practice.completed] }
    expect: { outcome: completed, event_ids: ["lgr_evt_conformance7"], unknown_types: [], cursor: { equals: c7 } }
