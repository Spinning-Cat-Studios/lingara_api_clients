id: op.events-iterate-pages
title: "The feed helper walks pages from no cursor, yields each event in order, and ends on has_more false with the last page's cursor"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - events: {}
    expect: { outcome: completed, event_ids: ["lgr_evt_conformance1","lgr_evt_conformance2"], unknown_types: [], cursor: { equals: c2 } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_feed, token_type: Bearer, expires_in: 3600, scope: "events:read" } }
    - request: { method: GET, path: /v1/events, headers: { authorization: { equals: Bearer lgr_at_feed } } }
      response: { status: 200, json: {"items":[{"id":"lgr_evt_conformance1","type":"lesson_plan.ready","created_at":"2026-10-01T09:12:44Z","api_version":"2026-09-equipped-boxfish","subject":"lgr_sub_conformance","data":{"plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","status":"complete","title":"At the night market","source_lang":"en","target_lang":"zh","level":2}}],"next_cursor":"c1","has_more":true} }
    - request: { method: GET, path: /v1/events, query: {"cursor":"c1"}, headers: { authorization: { equals: Bearer lgr_at_feed } } }
      response: { status: 200, json: {"items":[{"id":"lgr_evt_conformance2","type":"lesson_plan.failed","created_at":"2026-10-01T09:13:02Z","api_version":"2026-09-equipped-boxfish","subject":"lgr_sub_conformance","data":{"plan_id":"0f1e2d3c-4b5a-4978-8796-a5b4c3d2e1f0","reason":"generation_failed"}}],"next_cursor":"c2","has_more":false} }
