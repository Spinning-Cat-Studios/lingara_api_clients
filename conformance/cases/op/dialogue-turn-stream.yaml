id: op.dialogue-turn-stream
title: An NPC turn yields each delta and the notice, and ends on done without yielding it
behaviours: [K1, K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: sendDialogueTurn
      body: { npc: { name: Auntie Lin, persona: a street-food vendor who likes to haggle }, source_lang: en, target_lang: zh, level: 3, line: 饺子多少钱？, history: [ { speaker: npc, text: 来来来，刚出锅的饺子！ } ] }
    expect:
      outcome: completed
      events:
        - { event: delta, data: { text: 十块钱， } }
        - { event: delta, data: { text: 一盘。 } }
        - { event: notice, data: { code: history_trimmed, message: Older lines were left out of this reply. } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_opdialogue, token_type: Bearer, expires_in: 3600, scope: "embed:play" } }
    - request:
        method: POST
        path: /v1/embed/dialogue/turns
        headers: { authorization: { equals: Bearer lgr_at_opdialogue }, accept: { contains: text/event-stream } }
        json: { npc: { name: Auntie Lin, persona: a street-food vendor who likes to haggle }, source_lang: en, target_lang: zh, level: 3, line: 饺子多少钱？, history: [ { speaker: npc, text: 来来来，刚出锅的饺子！ } ] }
      response:
        status: 200
        sse:
          chunks:
            - "event: delta\ndata: {\"text\":\"十块钱，\"}\n\n"
            - "event: delta\ndata: {\"text\":\"一盘。\"}\n\n"
            - "event: notice\ndata: {\"code\":\"history_trimmed\",\"message\":\"Older lines were left out of this reply.\"}\n\n"
            - "event: done\ndata: {}\n\n"
          then: close
