id: op.dialogues-export-malformed-headers
title: "An export 200 without Lingara-Dialogue-Revision, a 304 without ETag, and a 200 whose revision is not an integer are each TransportError malformed_response after one request"
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: exportDialogue
      params: {"dialogue_id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71"}
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
      sleeps_s: []
  - call:
      operation: exportDialogue
      params: {"dialogue_id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71","if_none_match":"\"3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e\""}
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
      sleeps_s: []
  - call:
      operation: exportDialogue
      params: {"dialogue_id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71"}
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_dlbad, token_type: Bearer, expires_in: 3600, scope: "dialogues:read" } }
    - request: { method: GET, path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/export }
      response:
        status: 200
        headers: { content-type: application/json, etag: '"3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e"' }
        text: '{"checkpoints":[],"facts":[],"id":"night_market_keepers","schema":"dialogue.v1","start":"greet"}'
    - request: { method: GET, path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/export }
      response:
        status: 304
        headers: { lingara-dialogue-revision: 3 }
    - request: { method: GET, path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/export }
      response:
        status: 200
        headers: { content-type: application/json, etag: '"3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e"', lingara-dialogue-revision: two }
        text: '{"checkpoints":[],"facts":[],"id":"night_market_keepers","schema":"dialogue.v1","start":"greet"}'
