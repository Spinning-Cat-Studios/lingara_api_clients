id: k1.client-secret-post
title: With client_secret_post the credentials travel in the form and no Authorization header is sent
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: post }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
exchanges:
  items:
    - request:
        method: POST
        path: /oauth/token
        headers: { authorization: { absent: true } }
        form: { grant_type: client_credentials, client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000 }
      response: { status: 200, json: { access_token: lgr_at_k1post, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1post } } }
      response: { status: 200, json: { allowance: [] } }
