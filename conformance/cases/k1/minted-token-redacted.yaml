id: k1.minted-token-redacted
title: A minted embed token appears in no rendering of the client or the mint's result, nor of the error a malformed mint answer raises
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: createEmbedToken
      body: { player_ref: player-2001 }
    expect:
      outcome: completed
      status: 200
      redacted: [lgr_et_conformance22222222222222222222222222222222, lgr_at_k1mint]
  - call:
      operation: createEmbedToken
      body: { player_ref: player-2002 }
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
      redacted: [lgr_et_conformance33333333333333333333333333333333, lgr_at_k1mint]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1mint, token_type: Bearer, expires_in: 3600, scope: "embed:mint" } }
    - request: { method: POST, path: /v1/embed/tokens, json: { player_ref: player-2001 } }
      response: { status: 200, json: { token: lgr_et_conformance22222222222222222222222222222222, expires_at: "2026-10-01T09:27:44Z", expires_in: 900, subject: lgr_sub_conformance2d3c4b5a69788796, scopes: ["embed:play"], account_linked: false } }
    - request: { method: POST, path: /v1/embed/tokens, json: { player_ref: player-2002 } }
      response: { status: 200, json: { token: lgr_et_conformance33333333333333333333333333333333, expires_at: "2026-10-01T09:27:44Z", expires_in: 900, scopes: ["embed:play"], account_linked: false } }
