id: k1.malformed-token-response
title: A token 200 whose token_type is not Bearer is TransportError malformed_response, and nothing is cached
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: TransportError, fields: { kind: malformed_response } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1mac, token_type: mac, expires_in: 3600 } }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { token_type: Bearer, expires_in: 3600 } }
