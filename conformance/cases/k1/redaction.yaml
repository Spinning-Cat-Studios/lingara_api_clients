id: k1.redaction
title: Neither the client secret nor an access token appears in any rendering of the client, the token source or an error
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 403, code: insufficient_scope } }
      redacted: [lgr_cs_conformance00000000000000000000000000000000, lgr_at_k1redact]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1redact, token_type: Bearer, expires_in: 3600, scope: "vocab:generate" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1redact } } }
      response: { status: 403, json: { code: insufficient_scope, error: This call needs the usage:read scope. } }
