id: k1.failed-flight-not-cached
title: A failed exchange caches nothing, so the next call exchanges again
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: OAuthError, fields: { status: 500, error: server_error, description: The token could not be issued. } }
      sleeps_s: []
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 500, json: { error: server_error, error_description: The token could not be issued. } }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1retry, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1retry } } }
      response: { status: 200, json: { allowance: [] } }
