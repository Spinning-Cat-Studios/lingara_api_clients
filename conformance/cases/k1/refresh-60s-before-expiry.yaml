id: k1.refresh-60s-before-expiry
title: A 3600 s token is reused at 3539 s and replaced at 3541 s, 60 s before it expires
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
  - advance_clock_s: 3539
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
  - advance_clock_s: 2
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1early, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - times: 2
      request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1early } } }
      response: { status: 200, json: { allowance: [] } }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1later, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1later } } }
      response: { status: 200, json: { allowance: [] } }
