id: k1.token-rate-limited-retries
title: A 429 at the token endpoint with Retry-After within the cap is slept and retried on the exchange's own budget
behaviours: [K1, K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] }, sleeps_s: [4] }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response:
        status: 429
        headers: { retry-after: "4" }
        json: { error: rate_limited, error_description: Too many token requests. }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1limited, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1limited } } }
      response: { status: 200, json: { allowance: [] } }
