id: k1.unauthorized-refreshes-once
title: A 401 on a cached token invalidates it, exchanges once more and repeats the call once
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }   # 22 and 43 chars after the prefix
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
  - advance_clock_s: 600                     # well inside the token's life
  - call: { operation: getUsage }
    expect:
      outcome: completed
      status: 200
      body: { allowance: [ { feature: vocab, window: daily, limit: 50, used: 12, remaining: 38, reset_at: 1790208000 } ] }
      sleeps_s: []
exchanges:
  items:                                     # content-type defaults per D10 unless set
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_first, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_first } } }
      response: { status: 200, json: { allowance: [] } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_first } } }
      response:
        status: 401
        headers: { content-type: application/json }
        json: { code: unauthorized, error: "The access token is not valid." }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_second, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_second } } }
      response:
        status: 200
        json: { allowance: [ { feature: vocab, window: daily, limit: 50, used: 12, remaining: 38, reset_at: 1790208000 } ] }
