id: k1.single-flight
title: Eight concurrent calls on an empty cache share one token exchange
behaviours: [K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage, parallel: 8 }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
exchanges:
  items:
    - group: 1
      request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { delay_ms: 200, status: 200, json: { access_token: lgr_at_k1flight, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - group: 2
      times: 8
      request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1flight } } }
      response: { status: 200, json: { allowance: [] } }
