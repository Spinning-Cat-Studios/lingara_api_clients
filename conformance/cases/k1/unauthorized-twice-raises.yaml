id: k1.unauthorized-twice-raises
title: A second 401 after the one fresh exchange is raised as ApiError unauthorized
behaviours: [K1, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 401, code: unauthorized, message: The access token is not valid., retry_after: null } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1twice1, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1twice1 } } }
      response: { status: 401, json: { code: unauthorized, error: The access token is not valid. } }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k1twice2, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k1twice2 } } }
      response: { status: 401, json: { code: unauthorized, error: The access token is not valid. } }
