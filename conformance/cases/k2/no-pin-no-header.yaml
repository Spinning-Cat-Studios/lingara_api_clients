id: k2.no-pin-no-header
title: With no version configured, no request carries Lingara-Version and the library invents no default
behaviours: [K2]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
  - call: { operation: getOpenApiDocument }
    expect: { outcome: completed, status: 200, body: { openapi: 3.2.0, info: { title: Lingara API, version: 2026-09-knowing-tenpounder }, paths: {} } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, headers: { lingara-version: { absent: true } }, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k2nopin, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { lingara-version: { absent: true } } }
      response: { status: 200, json: { allowance: [] } }
    - request: { method: GET, path: /v1/openapi.json, headers: { lingara-version: { absent: true } } }
      response: { status: 200, json: { openapi: 3.2.0, info: { title: Lingara API, version: 2026-09-knowing-tenpounder }, paths: {} } }
