id: k2.deprecation-hook-called
title: A response under a deprecated version calls the hook once with the parsed Deprecation, Sunset and resolved Link
behaviours: [K2]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
  version: 2026-09-affable-cat
  deprecation_hook: record
steps:
  - call: { operation: getUsage }
    expect:
      outcome: completed
      status: 200
      body: { allowance: [] }
      served_version: 2026-09-affable-cat
      hook_calls:
        - version: 2026-09-affable-cat
          deprecated_at: 1790812800
          sunset_at: 1803859200
          link:
            raw: '</v1/versions/2026-09-affable-cat>; rel="deprecation"; type="application/json"'
            target: "{base_url}/v1/versions/2026-09-affable-cat"
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k2hook, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { lingara-version: { equals: 2026-09-affable-cat } } }
      response:
        status: 200
        headers:
          lingara-version: 2026-09-affable-cat
          deprecation: "@1790812800"
          sunset: "Mon, 01 Mar 2027 00:00:00 GMT"
          link: '</v1/versions/2026-09-affable-cat>; rel="deprecation"; type="application/json"'
        json: { allowance: [] }
