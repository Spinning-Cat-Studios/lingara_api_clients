id: k2.served-version-exposed
title: The response's Lingara-Version echo is exposed as served_version on a result and on a stream
behaviours: [K2, K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] }, served_version: 2026-09-knowing-tenpounder }
  - call:
      operation: sendTutorMessage
      body: { message: 你好, source_lang: en, target_lang: zh }
    expect:
      outcome: completed
      served_version: 2026-09-knowing-tenpounder
      events: [ { event: delta, data: { text: 你好！ } } ]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k2served, token_type: Bearer, expires_in: 3600, scope: "usage:read tutor:converse" } }
    - request: { method: GET, path: /v1/usage }
      response: { status: 200, headers: { lingara-version: 2026-09-knowing-tenpounder }, json: { allowance: [] } }
    - request: { method: POST, path: /v1/tutor/message, json: { message: 你好, source_lang: en, target_lang: zh } }
      response:
        status: 200
        headers: { lingara-version: 2026-09-knowing-tenpounder }
        sse:
          chunks:
            - "event: delta\ndata: {\"text\":\"你好！\"}\n\nevent: done\ndata: {}\n\n"
          then: close
