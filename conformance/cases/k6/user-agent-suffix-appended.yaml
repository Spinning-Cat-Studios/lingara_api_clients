id: k6.user-agent-suffix-appended
title: A caller's product token follows the library's, separated by one space, on every request
behaviours: [K6]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
  user_agent_suffix: kanji-quest/2.1
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
exchanges:
  items:
    - request:
        method: POST
        path: /oauth/token
        headers: { user-agent: { pattern: '^lingara-[a-z]+/\S+ \([^)]*\) kanji-quest/2\.1$' } }
        form: { grant_type: client_credentials }
      response: { status: 200, json: { access_token: lgr_at_k6suffix, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { user-agent: { pattern: '^lingara-[a-z]+/\S+ \([^)]*\) kanji-quest/2\.1$' } } }
      response: { status: 200, json: { allowance: [] } }
