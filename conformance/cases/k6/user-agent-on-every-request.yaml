id: k6.user-agent-on-every-request
title: The token request and the /v1 request both carry the library's User-Agent, which the server checks on every request
behaviours: [K6, K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] } }
exchanges:
  items:
    - request:
        method: POST
        path: /oauth/token
        headers: { user-agent: { prefix: lingara- } }
        form: { grant_type: client_credentials }
      response: { status: 200, json: { access_token: lgr_at_k6ua, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { user-agent: { prefix: lingara- } } }
      response: { status: 200, json: { allowance: [] } }
