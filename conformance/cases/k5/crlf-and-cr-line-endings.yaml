id: k5.crlf-and-cr-line-endings
title: Lines ending in CRLF, a bare CR or LF all end a line, and a CRLF split across writes is one line end
behaviours: [K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: sendTutorMessage
      body: { message: 你好, source_lang: en, target_lang: zh }
    expect:
      outcome: completed
      events:
        - { event: delta, data: { text: one } }
        - { event: delta, data: { text: two } }
        - { event: delta, data: { text: three } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k5crlf, token_type: Bearer, expires_in: 3600, scope: "tutor:converse" } }
    - request: { method: POST, path: /v1/tutor/message }
      response:
        status: 200
        sse:
          chunks:
            - "event: delta\r\ndata: {\"text\":\"one\"}\r\n\r\n"
            - "event: delta\rdata: {\"text\":\"two\"}\r\r"
            - "event: delta\r"
            - "\ndata: {\"text\":\"three\"}\r"
            - "\n\r"
            - "\nevent: done\ndata: {}\r\n\r\n"
          then: close
