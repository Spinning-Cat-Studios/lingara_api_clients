id: k5.error-event-raises-with-plan-id
title: An error event after progress raises ApiError with status 200 and the event's code, message and plan_id
behaviours: [K5, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: createLessonPlan
      body: { context: ordering at a night market, source_lang: en, target_lang: zh, level: 2 }
    expect:
      outcome: error
      events:
        - { event: started, data: { plan_id: 3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37 } }
        - { event: phase, data: { phase: selecting_vocabulary, attempt: 1 } }
      error: { variant: ApiError, fields: { status: 200, code: generation_failed, message: The plan could not be generated., plan_id: 3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37 } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k5error, token_type: Bearer, expires_in: 3600, scope: "lesson_plans:write" } }
    - request: { method: POST, path: /v1/lesson-plans }
      response:
        status: 200
        sse:
          chunks:
            - "event: started\ndata: {\"plan_id\":\"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37\"}\n\n"
            - "event: phase\ndata: {\"phase\":\"selecting_vocabulary\",\"attempt\":1}\n\n"
            - "event: error\ndata: {\"code\":\"generation_failed\",\"message\":\"The plan could not be generated.\",\"plan_id\":\"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37\"}\n\n"
          then: close
