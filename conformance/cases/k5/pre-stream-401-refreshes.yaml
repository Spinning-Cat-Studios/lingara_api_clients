id: k5.pre-stream-401-refreshes
title: A 401 before a stream opens takes K1's one fresh exchange and repeats the stream request once
behaviours: [K5, K1]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: streamLessonPlan
      params: { id: 3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37 }
    expect:
      outcome: completed
      events: [ { event: pending, data: { plan_id: 3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37, status: partial } } ]
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k5stale, token_type: Bearer, expires_in: 3600, scope: "lesson_plans:read" } }
    - request: { method: GET, path: /v1/lesson-plans/3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37/stream, headers: { authorization: { equals: Bearer lgr_at_k5stale } } }
      response: { status: 401, json: { code: unauthorized, error: The access token is not valid. } }
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k5fresh, token_type: Bearer, expires_in: 3600, scope: "lesson_plans:read" } }
    - request: { method: GET, path: /v1/lesson-plans/3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37/stream, headers: { authorization: { equals: Bearer lgr_at_k5fresh } } }
      response:
        status: 200
        sse:
          chunks: ["event: pending\ndata: {\"plan_id\":\"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37\",\"status\":\"partial\"}\n\n"]
          then: close
