id: k5.unknown-event-skipped
title: An event name the library does not know is skipped, as are a nameless frame and a frame with no data
behaviours: [K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: generateVocabulary
      body: { level: 2, source_lang: en, target_lang: zh, count: 1 }
    expect:
      outcome: completed
      events:
        - { event: started, data: { meta: { level: 2, source_lang: en, target_lang: zh, framework: HSK, count: 1, ai_generated: true } } }
        - { event: item, data: { word: 你好, translation: hello } }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k5unknown, token_type: Bearer, expires_in: 3600, scope: "vocab:generate" } }
    - request: { method: POST, path: /v1/vocab/stream }
      response:
        status: 200
        sse:
          chunks:
            - "event: started\ndata: {\"meta\":{\"level\":2,\"source_lang\":\"en\",\"target_lang\":\"zh\",\"framework\":\"HSK\",\"count\":1,\"ai_generated\":true}}\n\n"
            - "event: progress\ndata: {\"percent\":50}\n\n"
            - "data: {\"anonymous\":true}\n\n"
            - "event: item\n\n"
            - "event: item\ndata: {\"word\":\"你好\",\"translation\":\"hello\"}\n\n"
            - "event: done\ndata: {}\n\n"
          then: close
