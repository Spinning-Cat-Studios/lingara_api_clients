id: k5.eof-before-terminal
title: A stream that closes before its terminal event is TransportError stream_ended_early, after the events it did yield
behaviours: [K5, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: generateVocabulary
      body: { level: 2, source_lang: en, target_lang: zh, count: 2 }
    expect:
      outcome: error
      events:
        - { event: started, data: { meta: { level: 2, source_lang: en, target_lang: zh, framework: HSK, count: 2, ai_generated: true } } }
        - { event: item, data: { word: 你好, translation: hello } }
      error: { variant: TransportError, fields: { kind: stream_ended_early } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k5eof, token_type: Bearer, expires_in: 3600, scope: "vocab:generate" } }
    - request: { method: POST, path: /v1/vocab/stream }
      response:
        status: 200
        sse:
          chunks:
            - "event: started\ndata: {\"meta\":{\"level\":2,\"source_lang\":\"en\",\"target_lang\":\"zh\",\"framework\":\"HSK\",\"count\":2,\"ai_generated\":true}}\n\n"
            - "event: item\ndata: {\"word\":\"你好\",\"translation\":\"hello\"}\n\n"
            - "event: item\ndata: {\"word\":\"谢"
          then: close
