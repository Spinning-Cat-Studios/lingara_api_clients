id: k3.payment-required-402
title: A 402 spend_cap_reached is ApiError, not retried
behaviours: [K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: sendTutorMessage
      body: { message: 你好, source_lang: en, target_lang: zh }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 402, code: spend_cap_reached, message: This client has reached its monthly spend cap. } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k3cap, token_type: Bearer, expires_in: 3600, scope: "tutor:converse" } }
    - request: { method: POST, path: /v1/tutor/message }
      response: { status: 402, json: { code: spend_cap_reached, error: This client has reached its monthly spend cap. } }
