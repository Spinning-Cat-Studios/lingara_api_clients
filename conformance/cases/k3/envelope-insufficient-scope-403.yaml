id: k3.envelope-insufficient-scope-403
title: A /v1 envelope refusal is ApiError with the status, the code and the localised message
behaviours: [K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: generateVocabulary
      body: { level: 2, source_lang: en, target_lang: zh }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 403, code: insufficient_scope, message: Dieser Aufruf braucht den Scope vocab:generate., retry_after: null, plan_id: null } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k3scope, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: POST, path: /v1/vocab/stream, json: { level: 2, source_lang: en, target_lang: zh } }
      response: { status: 403, json: { code: insufficient_scope, error: Dieser Aufruf braucht den Scope vocab:generate. } }
