id: k4.retry-after-http-date
title: A Retry-After HTTP-date is read against the injected clock (it starts at 1790000000) and slept to the second
behaviours: [K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] }, sleeps_s: [3] }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4date, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage }
      response: { status: 429, headers: { retry-after: "Mon, 21 Sep 2026 14:13:23 GMT" }, json: { code: rate_limited, error: Slow down. } }
    - request: { method: GET, path: /v1/usage }
      response: { status: 200, json: { allowance: [] } }
