id: k4.503-retry-after-honoured
title: A JSON 503 with Retry-After within the cap is slept and retried, including a stream's request before it opens
behaviours: [K4, K5]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: sendTutorMessage
      body: { message: 你好, source_lang: en, target_lang: zh }
    expect:
      outcome: completed
      events: [ { event: delta, data: { text: 你好！ } } ]
      sleeps_s: [5]
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4b, token_type: Bearer, expires_in: 3600, scope: "tutor:converse" } }
    - request: { method: POST, path: /v1/tutor/message, json: { message: 你好, source_lang: en, target_lang: zh } }
      response: { status: 503, headers: { retry-after: "5" }, json: { code: unavailable, error: The tutor is busy. } }
    - request: { method: POST, path: /v1/tutor/message, json: { message: 你好, source_lang: en, target_lang: zh } }
      response:
        status: 200
        sse:
          chunks: ["event: delta\ndata: {\"text\":\"你好！\"}\n\nevent: done\ndata: {}\n\n"]
          then: close
