id: k4.opt-out
title: With max_attempts 1 a retryable 429 is raised at once
behaviours: [K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
  retries: { max_attempts: 1 }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 429, code: rate_limited, retry_after: 1 } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4off, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage }
      response: { status: 429, headers: { retry-after: "1" }, json: { code: rate_limited, error: Slow down. } }
