id: k4.429-retry-after-honoured
title: A 429 with Retry-After within the cap is slept exactly, with no jitter, and the request repeated unchanged
behaviours: [K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect: { outcome: completed, status: 200, body: { allowance: [] }, sleeps_s: [2] }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4a, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k4a } } }
      response: { status: 429, headers: { retry-after: "2" }, json: { code: rate_limited, error: Slow down. } }
    - request: { method: GET, path: /v1/usage, headers: { authorization: { equals: Bearer lgr_at_k4a } } }
      response: { status: 200, json: { allowance: [] } }
