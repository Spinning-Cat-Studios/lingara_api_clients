id: k4.retry-after-over-cap-raises
title: A Retry-After above the 60 s cap is raised at once, carrying retry_after so the caller can schedule it
behaviours: [K4, K3]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call: { operation: getUsage }
    expect:
      outcome: error
      error: { variant: ApiError, fields: { status: 429, code: rate_limited, retry_after: 3600 } }
      sleeps_s: []
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4cap, token_type: Bearer, expires_in: 3600, scope: "usage:read" } }
    - request: { method: GET, path: /v1/usage }
      response: { status: 429, headers: { retry-after: "3600" }, json: { code: rate_limited, error: Your daily allowance is spent. } }
