id: k4.send-event-retry-keeps-key
title: "A sendEvent retried after a 429 sends the same Idempotency-Key on every attempt, so the retry gets the first answer"
behaviours: [K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: sendEvent
      body: {"type":"world.context_changed","data":{"scene":"A night market after rain","source_lang":"en","target_lang":"zh","level":2,"generate":true}}
    expect: { outcome: completed, status: 202, body: {"id":"lgr_evt_conformance9","type":"world.context_changed","created_at":"2026-10-01T09:12:44Z","reaction":{"status":"started","plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","plan_status":"generating"}}, sleeps_s: [1] }
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4key, token_type: Bearer, expires_in: 3600, scope: "events:write lesson_plans:write" } }
    - request: { method: POST, path: /v1/events, headers: { idempotency-key: { pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' } }, json: {"type":"world.context_changed","data":{"scene":"A night market after rain","source_lang":"en","target_lang":"zh","level":2,"generate":true}} }
      response: { status: 429, headers: { retry-after: "1" }, json: { code: rate_limited, error: Slow down. } }
    - request: { method: POST, path: /v1/events, headers: { idempotency-key: { same_as: { request: 1, header: idempotency-key } } }, json: {"type":"world.context_changed","data":{"scene":"A night market after rain","source_lang":"en","target_lang":"zh","level":2,"generate":true}} }
      response: { status: 202, json: {"id":"lgr_evt_conformance9","type":"world.context_changed","created_at":"2026-10-01T09:12:44Z","reaction":{"status":"started","plan_id":"3f1c2a9e-5b7d-4e21-9a0c-6d8e4f2b1a37","plan_status":"generating"}} }
