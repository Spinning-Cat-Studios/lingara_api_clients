id: k4.dialogues-export-retried
title: "A 503 with Retry-After on exportDialogue's GET is slept and retried once, and the second GET's 200 answers the body"
behaviours: [K4]
client:
  credentials: { client_id: lgr_cid_conformance00000000000, client_secret: lgr_cs_conformance00000000000000000000000000000000, auth: basic }
steps:
  - call:
      operation: exportDialogue
      params: {"dialogue_id":"4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71"}
    expect:
      outcome: completed
      sleeps_s: [1]
      body:
        revision: 3
        etag: '"3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e"'
        ir_json: '{"checkpoints":[],"facts":[],"id":"night_market_keepers","schema":"dialogue.v1","start":"greet"}'
exchanges:
  items:
    - request: { method: POST, path: /oauth/token, form: { grant_type: client_credentials } }
      response: { status: 200, json: { access_token: lgr_at_k4dialogue, token_type: Bearer, expires_in: 3600, scope: "dialogues:read" } }
    - request: { method: GET, path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/export }
      response: { status: 503, headers: { retry-after: "1" }, json: { code: unavailable, error: Try again shortly. } }
    - request: { method: GET, path: /v1/dialogues/4c8e2f1a-9b3d-4e7f-8a6c-2d1e0f9b8a71/export }
      response:
        status: 200
        headers: { content-type: application/json, etag: '"3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e3b7e"', lingara-dialogue-revision: 3 }
        text: '{"checkpoints":[],"facts":[],"id":"night_market_keepers","schema":"dialogue.v1","start":"greet"}'
