[package]
name = "spec-codegen"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Writes the generator view (OpenAPI 3.1 and 3.0) of the Lingara OpenAPI 3.2 document"

[dependencies]
# preserve_order: key order follows the source, so the view is byte-stable.
serde_json = { version = "1", features = ["preserve_order"] }
# --registry (ADR 30.9.26a §3) reads the vendored versions.toml.
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# One test only (ADR 6.10.26i D2): its `current_id` and `current_entry` here
# pick the same id. A dev-dependency, so the tool the app kit installs by tag
# never compiles this crate's view builder.
release-manifest = { path = "../release-manifest" }
