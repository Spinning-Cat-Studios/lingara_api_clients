overlay: 1.0.0
info:
  title: Go names for the Lingara generator view
  version: 1.0.0
actions:
  # The refusal envelope's schema is named Error, which the package reserves
  # for the marker interface every K3 error implements (ADR 29.9.26q D4).
  - target: $.components.schemas.Error
    update:
      x-go-name: ErrorEnvelope
  - target: $.components.responses.Error
    update:
      x-go-name: ErrorResponse
  # Two anyOf scalars (boolean, number or string): oapi-codegen's union for
  # them imports its runtime package, and the module's require block is
  # empty. Each is an open JSON value instead, so a canvas node's params
  # decode as map[string]any (ADR 16.10.26ak D6) and a dialogue fact as any.
  - target: $.components.schemas.CanvasParam
    update:
      x-go-type: any
  - target: $.components.schemas.FactValue
    update:
      x-go-type: any
