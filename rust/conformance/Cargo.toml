[package]
name = "lingara-conformance-harness"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Runs every Lingara conformance case through the lingara crate's public API"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lingara = { path = ".." }
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
